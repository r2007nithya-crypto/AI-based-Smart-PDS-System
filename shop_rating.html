<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Rate Fair Price Shop | Smart PDS</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <style>

        body {
            background: #f5f8fc;
            font-family: Arial, sans-serif;
        }

        .rating-card {
            max-width: 700px;
            margin: 60px auto;
            background: white;
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 10px 35px rgba(18,59,109,0.10);
        }

        .star-rating {
    display: flex;
    flex-direction: row-reverse;
    justify-content: flex-end;
    gap: 6px;
    margin-top: 10px;
}

.star-rating input {
    display: none;
}

.star-rating label {
    font-size: 40px;
    color: #d5dbe3;
    cursor: pointer;
    transition: 0.2s;
    line-height: 1;
}

.star-rating label:hover,
.star-rating label:hover ~ label,
.star-rating input:checked ~ label {
    color: #f5b301;
}

        .submit-btn {
            background: #123b6d;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 10px;
        }

        .submit-btn:hover {
            background: #0d2e55;
            color: white;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="rating-card">

        <div class="text-center mb-4">

            <i
                class="bi bi-star-fill text-warning"
                style="font-size:45px;"
            ></i>

            <h2 class="fw-bold mt-3">
                Rate Your Fair Price Shop
            </h2>

            <p class="text-muted">
                Your feedback helps improve PDS services.
            </p>

        </div>


        {% if success %}

        <div class="alert alert-success">
            <i class="bi bi-check-circle me-2"></i>
            {{ success }}
        </div>

        {% endif %}


        <form method="POST">

            <div class="mb-4">

                <label class="form-label fw-bold">
                    Select Fair Price Shop
                </label>

                <select
                    name="shop_id"
                    class="form-select"
                    required
                >

                    <option value="">
                        Select a shop
                    </option>

                    {% for shop in shops %}

                    <option value="{{ shop.shop_id }}">

                        {{ shop.shop_code }} -
                        {{ shop.shop_name }}

                    </option>

                    {% endfor %}

                </select>

            </div>


            <div class="mb-4">

                <label class="form-label fw-bold">
                    Your Rating
                </label>

                <div class="star-rating">

                    <input
                        type="radio"
                        id="star5"
                        name="rating"
                        value="5"
                        required
                    >
                    <label for="star5">★</label>

                    <input
                        type="radio"
                        id="star4"
                        name="rating"
                        value="4"
                    >
                    <label for="star4">★</label>

                    <input
                        type="radio"
                        id="star3"
                        name="rating"
                        value="3"
                    >
                    <label for="star3">★</label>

                    <input
                        type="radio"
                        id="star2"
                        name="rating"
                        value="2"
                    >
                    <label for="star2">★</label>

                    <input
                        type="radio"
                        id="star1"
                        name="rating"
                        value="1"
                    >
                    <label for="star1">★</label>

                </div>

            </div>


            <div class="mb-4">

                <label class="form-label fw-bold">
                    Feedback
                </label>

                <textarea
                    name="feedback"
                    class="form-control"
                    rows="5"
                    placeholder="Tell us about your experience..."
                ></textarea>

            </div>


            <button
                type="submit"
                class="submit-btn w-100"
            >

                <i class="bi bi-send me-2"></i>

                Submit Rating & Feedback

            </button>

        </form>

    </div>

</div>

</body>

</html>
