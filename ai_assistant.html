<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Citizen Assistant | Smart PDS</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <style>

        body {
            background: #f5f8fc;
            font-family: Arial, sans-serif;
            color: #172033;
        }

        .ai-header {
            background: linear-gradient(135deg, #123b6d, #1b5a8d);
            color: white;
            padding: 45px 20px;
            border-radius: 0 0 25px 25px;
        }

        .ai-icon {
            width: 65px;
            height: 65px;
            border-radius: 18px;
            background: rgba(255,255,255,0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin-bottom: 15px;
        }

        .chat-container {
            max-width: 850px;
            margin: -25px auto 50px;
            position: relative;
        }

        .chat-card {
            background: white;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(18,59,109,0.10);
            overflow: hidden;
        }

        .chat-body {
            min-height: 350px;
            max-height: 500px;
            overflow-y: auto;
            padding: 25px;
        }

        .bot-message {
            background: #edf4fa;
            padding: 15px;
            border-radius: 14px;
            max-width: 80%;
        }

        .suggestion {
            border: 1px solid #dce5ee;
            background: white;
            border-radius: 10px;
            padding: 10px 14px;
            margin: 5px;
            font-size: 13px;
            cursor: pointer;
        }

        .suggestion:hover {
            background: #edf4fa;
        }

        .send-btn {
            background: #123b6d;
            color: white;
            border: none;
            padding: 0 22px;
        }

        .send-btn:hover {
            background: #0d2d52;
            color: white;
        }

    </style>

</head>


<body>


<!-- HEADER -->

<div class="ai-header">

    <div class="container">

        <div class="ai-icon">

            <i class="bi bi-stars"></i>

        </div>

        <h1 class="fw-bold">
            AI Citizen Assistant
        </h1>

        <p class="mb-0">
            Welcome {{ name }}. Ask questions about Tamil Nadu PDS services.
        </p>

    </div>

</div>



<!-- CHAT -->

<div class="container chat-container">

    <div class="chat-card">


        <!-- CHAT MESSAGES -->

        <div class="chat-body" id="chatBody">


            <!-- INITIAL BOT MESSAGE -->

            <div class="d-flex gap-3 mb-4">

                <div
                    class="ai-icon text-white"
                    style="
                        background:#123b6d;
                        width:45px;
                        height:45px;
                        font-size:18px;
                        min-width:45px;
                    "
                >

                    <i class="bi bi-robot"></i>

                </div>


                <div class="bot-message">

                    <strong>
                        Smart PDS Assistant
                    </strong>

                    <p class="mb-0 mt-1">

                        Hello! I can help you with ration entitlement,
                        tokens, complaints, stock, home delivery and
                        other PDS services.

                    </p>

                </div>

            </div>



            <!-- QUICK QUESTIONS -->

            <div class="mb-3">

                <small class="text-muted fw-bold">

                    QUICK QUESTIONS

                </small>

            </div>


            <div class="d-flex flex-wrap">


                <button
                    type="button"
                    class="suggestion"
                    onclick="askQuickQuestion('How can I book a ration token?')"
                >

                    How can I book a ration token?

                </button>


                <button
                    type="button"
                    class="suggestion"
                    onclick="askQuickQuestion('What is my monthly entitlement?')"
                >

                    What is my monthly entitlement?

                </button>


                <button
                    type="button"
                    class="suggestion"
                    onclick="askQuickQuestion('How can I register a complaint?')"
                >

                    How can I register a complaint?

                </button>


                <button
                    type="button"
                    class="suggestion"
                    onclick="askQuickQuestion('Who is eligible for home delivery?')"
                >

                    Who is eligible for home delivery?

                </button>


                <button
                    type="button"
                    class="suggestion"
                    onclick="askQuickQuestion('How can I check shop stock?')"
                >

                    How can I check shop stock?

                </button>


                <button
                    type="button"
                    class="suggestion"
                    onclick="askQuickQuestion('என் ரேஷன் ஒதுக்கீடு என்ன?')"
                >

                    என் ரேஷன் ஒதுக்கீடு என்ன?

                </button>


            </div>


        </div>



        <!-- MESSAGE INPUT -->

        <div class="border-top p-3">

            <div class="input-group">

                <input
                    type="text"
                    class="form-control"
                    id="questionInput"
                    placeholder="Ask your PDS question..."
                    autocomplete="off"
                >


                <button
                    class="btn send-btn"
                    type="button"
                    onclick="sendQuestion()"
                >

                    <i class="bi bi-send me-1"></i>

                    Send

                </button>

            </div>

        </div>


    </div>

</div>



<!-- JAVASCRIPT -->

<script>

async function askQuickQuestion(question) {

    const input = document.getElementById("questionInput");

    input.value = question;

    await sendQuestion();

}



async function sendQuestion() {

    const input = document.getElementById("questionInput");

    const question = input.value.trim();

    if (!question) {
        return;
    }


    const chatBody = document.getElementById("chatBody");


    // USER MESSAGE

    const userMessage = document.createElement("div");

    userMessage.className =
        "d-flex justify-content-end mb-3";


    userMessage.innerHTML = `

        <div style="
            background:#123b6d;
            color:white;
            padding:12px 16px;
            border-radius:14px;
            max-width:75%;
        ">

            ${question}

        </div>

    `;


    chatBody.appendChild(userMessage);


    input.value = "";


    // THINKING MESSAGE

    const thinkingMessage =
        document.createElement("div");


    thinkingMessage.className =
        "d-flex gap-3 mb-3";


    thinkingMessage.innerHTML = `

        <div
            class="ai-icon text-white"
            style="
                background:#123b6d;
                width:45px;
                height:45px;
                min-width:45px;
                font-size:18px;
            "
        >

            <i class="bi bi-robot"></i>

        </div>


        <div class="bot-message">

            Thinking...

        </div>

    `;


    chatBody.appendChild(thinkingMessage);


    chatBody.scrollTop =
        chatBody.scrollHeight;


    try {

        const response = await fetch(
            "/ai-assistant/ask",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    question: question
                })
            }
        );


        const data =
            await response.json();


        thinkingMessage
            .querySelector(".bot-message")
            .innerText =
            data.answer;


    } catch (error) {

        thinkingMessage
            .querySelector(".bot-message")
            .innerText =
            "Sorry, I could not connect to the Smart PDS Assistant.";

        console.error(error);

    }


    chatBody.scrollTop =
        chatBody.scrollHeight;

}



// ENTER KEY SUPPORT

document
    .getElementById("questionInput")
    .addEventListener("keydown", function(event) {

        if (event.key === "Enter") {
            sendQuestion();
        }

    });

</script>


</body>

</html>
